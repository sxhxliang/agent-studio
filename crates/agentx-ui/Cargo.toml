[package]
name = "agentx-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Driving adapter (GPUI). Depends on the application + domain + bus and the pure
# presentational ACP widgets. It must NOT depend on the driven adapters
# (agentx-acp, agentx-store) — it only knows use-cases and the domain.
# Driving adapter (GPUI). Depends on the application + domain + bus only. It must
# NOT depend on the driven adapters (agentx-acp, agentx-store) — it only knows
# use-cases and the domain. The composition root (agentx-shell) wires adapters.
[dependencies]
agentx-domain.workspace = true
agentx-app.workspace = true
agentx-bus.workspace = true
agentx-acp-ui.workspace = true
agent-client-protocol.workspace = true
gpui.workspace = true
gpui-component.workspace = true
similar.workspace = true
chrono.workspace = true
log.workspace = true
rfd = "0.15"
base64 = "0.22"

# The preview gallery (`cargo run -p agentx-ui --example gallery`) boots a real
# GPUI window, so it needs the platform layer and the icon assets — same crates
# the composition root (agentx-shell) uses.
[dev-dependencies]
gpui_platform.workspace = true
gpui-component-assets = { git = "https://github.com/sxhxliang/gpui-component", branch = "dev" }

[lints]
workspace = true
