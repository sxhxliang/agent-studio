[package]
name = "agentx-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Driven adapter. Depends on agentx-domain (to implement its port traits) plus
# pure I/O crates. Must not depend on agentx-app or agentx-ui. I/O is blocking
# `std::fs` so the async port methods can be awaited from any executor (incl.
# GPUI's, which is not a Tokio runtime).
[dependencies]
agentx-domain.workspace = true
serde = { workspace = true }
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
anyhow.workspace = true
dirs.workspace = true
log.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-util"] }
tempfile = "3"

[lints]
workspace = true
